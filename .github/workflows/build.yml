name: Build via Gradle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read build metadata
        id: meta
        run: |
          if [ -f .build-meta.json ]; then
            echo "chat_id=$(jq -r '.chatId' .build-meta.json)" >> $GITHUB_OUTPUT
            echo "app_name=$(jq -r '.appName' .build-meta.json)" >> $GITHUB_OUTPUT
            echo "has_meta=true" >> $GITHUB_OUTPUT
          else
            echo "has_meta=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Telegram notifier
        if: steps.meta.outputs.has_meta == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.meta.outputs.chat_id }}
        run: |
          cat > /tmp/notify.sh << 'SCRIPT'
          #!/bin/bash
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${CHAT_ID}\",\"text\":\"$1\"}" > /dev/null
          SCRIPT
          chmod +x /tmp/notify.sh
          echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" >> $GITHUB_ENV
          echo "CHAT_ID=${CHAT_ID}" >> $GITHUB_ENV

      - name: Notify - Build started
        if: steps.meta.outputs.has_meta == 'true'
        run: bash /tmp/notify.sh "[1/5] Gradle Build started..."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Fix dependency compatibility
        run: npx expo install --fix 2>&1 || true

      - name: Create placeholder assets
        run: |
          mkdir -p assets
          python3 -c "
          import base64
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAIAAADYYG7QAAAADklEQVRYw+3BAQ0AAADCoPdPbQ43oAAAAIdJREFUeJztwQENAAAAwqD3T20ON6AAAH5tGYAAAU8sLwAAAABJRU5ErkJggg==')
          for name in ['icon.png', 'splash.png', 'adaptive-icon.png', 'favicon.png']:
            with open(f'assets/{name}', 'wb') as f:
              f.write(png)
          "

      - name: Notify - Prebuild
        if: steps.meta.outputs.has_meta == 'true'
        run: bash /tmp/notify.sh "[2/5] Running Expo prebuild..."

      - name: Clean app.json and Prebuild
        run: |
          python3 -c "
          import json
          with open('app.json') as f:
            data = json.load(f)
          expo = data.get('expo', data)
          for key in ['icon', 'splash', 'adaptiveIcon']:
            expo.pop(key, None)
          if 'android' in expo:
            expo['android'].pop('adaptiveIcon', None)
          if 'plugins' in expo:
            expo['plugins'] = [p for p in expo['plugins'] if not (isinstance(p, list) and 'expo-splash-screen' in str(p))]
          with open('app.json', 'w') as f:
            json.dump(data if 'expo' in data else {'expo': expo}, f, indent=2)
          "
          npx expo prebuild --platform android --no-install

      - name: Setup release signing
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release-key.keystore \
            -alias release-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Auto Builder,OU=Dev,O=AutoExpo,L=City,S=State,C=US"
          cd android/app
          sed -i '/android {/a\    signingConfigs {\n        release {\n            storeFile file("release-key.keystore")\n            storePassword "android"\n            keyAlias "release-key"\n            keyPassword "android"\n        }\n    }' build.gradle
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' build.gradle

      - name: Notify - Gradle building
        if: steps.meta.outputs.has_meta == 'true'
        run: bash /tmp/notify.sh "[3/5] Building APK with Gradle... (10-20 min)"

      - name: Gradle assembleRelease
        id: gradle_build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1
          cd ..
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "APK built: $APK_PATH"
          else
            echo "No APK found!"; exit 1
          fi

      - name: Notify - Uploading
        if: steps.meta.outputs.has_meta == 'true'
        run: bash /tmp/notify.sh "[4/5] Uploading APK..."

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: ${{ steps.gradle_build.outputs.apk_path }}
          retention-days: 30

      - name: Notify - Success
        if: steps.meta.outputs.has_meta == 'true'
        env:
          APP_NAME: ${{ steps.meta.outputs.app_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash /tmp/notify.sh "[5/5] APK ready! App: ${APP_NAME} - Download: ${RUN_URL}#artifacts"

      - name: Notify - Failed
        if: failure() && steps.meta.outputs.has_meta == 'true'
        env:
          APP_NAME: ${{ steps.meta.outputs.app_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash /tmp/notify.sh "Gradle Build failed for: ${APP_NAME}. Logs: ${RUN_URL}"
