name: Build via Gradle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read build metadata
        id: meta
        run: |
          if [ -f .build-meta.json ]; then
            echo "chat_id=$(jq -r '.chatId' .build-meta.json)" >> $GITHUB_OUTPUT
            echo "app_name=$(jq -r '.appName' .build-meta.json)" >> $GITHUB_OUTPUT
            echo "has_meta=true" >> $GITHUB_OUTPUT
          else
            echo "has_meta=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Telegram notifier
        if: steps.meta.outputs.has_meta == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.meta.outputs.chat_id }}
        run: |
          cat > /tmp/notify.sh << 'SCRIPT'
          #!/bin/bash
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${CHAT_ID}\",\"text\":\"$1\"}" > /dev/null
          SCRIPT
          chmod +x /tmp/notify.sh
          echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" >> $GITHUB_ENV
          echo "CHAT_ID=${CHAT_ID}" >> $GITHUB_ENV

      - name: Notify - Build started
        if: steps.meta.outputs.has_meta == 'true'
        run: bash /tmp/notify.sh "[1/5] Gradle Build started..."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Fix dependency compatibility
        run: npx expo install --fix 2>&1 || true

      - name: Create placeholder assets
        run: |
          mkdir -p assets
          python3 -c "
          import base64
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAIAAADYYG7QAAAADklEQVRYw+3BAQ0AAADCoPdPbQ43oAAAAIdJREFUeJztwQENAAAAwqD3T20ON6AAAH5tGYAAAU8sLwAAAABJRU5ErkJggg==')
          for name in ['icon.png', 'splash.png', 'adaptive-icon.png', 'favicon.png']:
            with open(f'assets/{name}', 'wb') as f:
              f.write(png)
          "

      - name: Notify - Prebuild
        if: steps.meta.outputs.has_meta == 'true'
        run: bash /tmp/notify.sh "[2/5] Running Expo prebuild..."

      - name: Ensure critical dependencies
        run: |
          npm install --legacy-peer-deps babel-preset-expo @babel/core --save-dev 2>&1 || true

      - name: Clean app.json and Prebuild
        run: |
          python3 -c "
          import json
          with open('app.json') as f:
            data = json.load(f)
          expo = data.get('expo', data)
          for key in ['icon', 'splash', 'adaptiveIcon']:
            expo.pop(key, None)
          if 'android' in expo:
            expo['android'].pop('adaptiveIcon', None)
          if 'plugins' in expo:
            expo['plugins'] = [p for p in expo['plugins'] if not (isinstance(p, list) and 'expo-splash-screen' in str(p))]
          with open('app.json', 'w') as f:
            json.dump(data if 'expo' in data else {'expo': expo}, f, indent=2)
          "
          npx expo prebuild --platform android --no-install

      - name: Setup release signing
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release-key.keystore \
            -alias release-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Auto Builder,OU=Dev,O=AutoExpo,L=City,S=State,C=US"
          cd android/app
          sed -i '/android {/a\    signingConfigs {\n        release {\n            storeFile file("release-key.keystore")\n            storePassword "android"\n            keyAlias "release-key"\n            keyPassword "android"\n        }\n    }' build.gradle
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' build.gradle

      - name: Make node visible to Gradle
        run: |
          # Gradle's Process.execute() doesn't use shell PATH, so node must be in a standard location
          sudo ln -sf "$(which node)" /usr/local/bin/node
          echo "Node linked: $(node --version) at $(which node)"

      - name: Fix settings.gradle node resolution
        run: |
          # Verify node can resolve modules from android/ directory
          cd android
          if ! node --print "require.resolve('expo/package.json')" 2>/dev/null; then
            echo "Node module resolution failed from android/. Patching settings.gradle..."
            cd ..
            # Replace execute(null, rootDir) with execute(null, file("..")) to resolve from project root
            sed -i 's|\.execute(null, rootDir)|.execute(null, new File(rootDir, ".."))|g' android/settings.gradle
            # Also handle cases without rootDir argument
            sed -i 's|\.execute()|.execute(null, new File(settings.rootDir, ".."))|g' android/settings.gradle
            echo "Patched settings.gradle:"
            cat android/settings.gradle
          else
            echo "Node resolution OK from android/"
          fi

      - name: Notify - Gradle building
        if: steps.meta.outputs.has_meta == 'true'
        run: bash /tmp/notify.sh "[3/5] Building APK with Gradle... (10-20 min)"

      - name: Gradle assembleRelease
        id: gradle_build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1
          cd ..
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "APK built: $APK_PATH"
          else
            echo "No APK found!"; exit 1
          fi

      - name: Notify - Uploading
        if: steps.meta.outputs.has_meta == 'true'
        run: bash /tmp/notify.sh "[4/5] Uploading APK..."

      - name: Rename APK
        id: rename
        run: |
          APK_SRC="${{ steps.gradle_build.outputs.apk_path }}"
          APK_NAME="app-release-build-${{ github.run_number }}.apk"
          cp "$APK_SRC" "$APK_NAME"
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Build #${{ github.run_number }} - ${{ steps.meta.outputs.app_name }}"
          body: "Auto-generated APK build"
          files: ${{ steps.rename.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get download URL
        id: download_url
        run: |
          REPO="${{ github.repository }}"
          TAG="v1.0.${{ github.run_number }}"
          APK_NAME="${{ steps.rename.outputs.apk_name }}"
          echo "url=https://github.com/${REPO}/releases/download/${TAG}/${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Notify - Success
        if: steps.meta.outputs.has_meta == 'true'
        env:
          APP_NAME: ${{ steps.meta.outputs.app_name }}
          APK_URL: ${{ steps.download_url.outputs.url }}
        run: |
          bash /tmp/notify.sh "[5/5] APK ready! App: ${APP_NAME} - Download: ${APK_URL}"

      - name: Collect error logs
        id: error_logs
        if: failure()
        run: |
          ERROR=""
          # Collect gradle errors
          if [ -f android/app/build/outputs/logs/manifest-merger-release-report.txt ]; then
            ERROR="$ERROR$(cat android/app/build/outputs/logs/manifest-merger-release-report.txt | tail -50)"
          fi
          # Collect from gradle output
          ERROR="$ERROR $(grep -r 'error:\|Error:\|FAILURE\|What went wrong\|Cannot find\|SyntaxError\|TypeError' /tmp/*.log 2>/dev/null | tail -30 || true)"
          # Fallback: get last 50 lines of the gradle step
          if [ -z "$ERROR" ]; then
            ERROR="Build failed. Check GitHub Actions logs."
          fi
          # Save to file (GitHub outputs have size limits)
          echo "$ERROR" > /tmp/build-error.txt
          echo "has_error=true" >> $GITHUB_OUTPUT

      - name: Trigger auto-fix
        if: failure() && steps.error_logs.outputs.has_error == 'true' && steps.meta.outputs.has_meta == 'true'
        env:
          CHAT_ID: ${{ steps.meta.outputs.chat_id }}
          BOT_URL: ${{ secrets.BOT_URL }}
        run: |
          ERROR=$(cat /tmp/build-error.txt | head -c 3000)
          if [ -n "$BOT_URL" ]; then
            echo "Sending error to bot for auto-fix..."
            curl -s -X POST "${BOT_URL}/build-error" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "import json; print(json.dumps({'chatId': '${CHAT_ID}', 'error': open('/tmp/build-error.txt').read()[:3000], 'buildMode': 'gradle'}))")" || true
          fi

      - name: Notify - Failed
        if: failure() && steps.meta.outputs.has_meta == 'true'
        env:
          APP_NAME: ${{ steps.meta.outputs.app_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash /tmp/notify.sh "Build failed for: ${APP_NAME}. AI is attempting auto-fix... Logs: ${RUN_URL}"
